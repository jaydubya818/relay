name: Relay qualification

on:
  pull_request:
  push:
    branches: [main, codex/relay-owner-experience, codex/relay-owner-checkpoint-b, codex/relay-composio-integration]

permissions:
  contents: read

concurrency:
  group: relay-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      RELAY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RELAY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/relay_ci
      RELAY_SESSION_SECRET: ci-session-secret-not-for-production
      RELAY_ENCRYPTION_KEY: ci-encryption-key-not-for-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm v2:frontier:check
      - run: pnpm db:check
      - run: pnpm exec tsx scripts/verify-owner-contracts.ts
        if: contains(github.ref, 'relay-owner-checkpoint-b') || contains(github.head_ref, 'relay-owner-checkpoint-b') || contains(github.ref, 'relay-composio-integration') || contains(github.head_ref, 'relay-composio-integration')
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:ci
      - run: pnpm test:performance
      - run: pnpm build
