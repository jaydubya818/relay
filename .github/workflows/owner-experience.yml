name: Owner experience browser qualification
on:
  pull_request:
  push:
    branches: [codex/relay-owner-experience, codex/relay-owner-checkpoint-b]
permissions:
  contents: read
jobs:
  owner-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RELAY_OWNER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/relay_e2e_owner_experience
      # Committed screenshots are macOS Chromium baselines. Linux runs all
      # journeys, viewport/overflow checks and axe checks without comparing fonts.
      RELAY_OWNER_SKIP_VISUAL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.5.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config=playwright.owner.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: owner-browser-failure-evidence
          path: test-results/
